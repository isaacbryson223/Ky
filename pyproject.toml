[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ky"
version = "0.1.0"
description = "Agent Ky: finds entry-level healthcare jobs that build clinical hours, tailors honest ATS-friendly resumes, and keeps a pre-nursing candidate updated."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ky = "ky.cli:main"

[tool.setuptools.packages.find]
include = ["ky*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
