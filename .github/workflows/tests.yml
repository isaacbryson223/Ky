name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Check the helper page script parses
        run: |
          python - <<'EOF'
          import re
          s = open("helper/ky.html").read()
          open("/tmp/ky.js", "w").write(re.findall(r"<script>(.*?)</script>", s, re.S)[-1])
          EOF
          node --check /tmp/ky.js
